name: Validate Planning Docs

# Runs on every push/PR to main so the repo structure is checked automatically.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::/docs folder is missing"
            exit 1
          fi
          echo "/docs folder found."

      - name: Check required planning files are present
        run: |
          required_files=(
            "docs/ERD.pdf"
            "docs/API_Endpoint_Plan.md"
            "docs/database.sql"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"
              missing=1
            else
              echo "Found: $f"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Check README exists and mentions required sections
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing"
            exit 1
          fi
          for keyword in "System" "Role" "YouTube"; do
            if ! grep -qi "$keyword" README.md; then
              echo "::error::README.md is missing an expected section mentioning '$keyword'"
              exit 1
            fi
          done
          echo "README.md structure looks good."

      - name: Validate SQL script is not empty and creates all core tables
        run: |
          required_tables=("Roles" "Users" "Events" "Categories" "Enrolments" "Results")
          for t in "${required_tables[@]}"; do
            if ! grep -q "CREATE TABLE $t" docs/database.sql; then
              echo "::error::database.sql is missing CREATE TABLE for $t"
              exit 1
            fi
          done
          echo "All required tables found in database.sql."

      - name: Structure validation passed
        run: echo "RaceDay Part 1 planning artifacts are all present and structured correctly."
